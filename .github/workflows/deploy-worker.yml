name: Verify and deploy Cloudflare Worker

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  deploy:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch')
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Validate deploy secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_URL: ${{ secrets.CLOUDFLARE_API_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          BOT_API_SECRET: ${{ secrets.BOT_API_SECRET }}
          MIGRATION_SECRET: ${{ secrets.MIGRATION_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
        run: |
          missing=()
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_URL AUTH_SECRET BOT_API_SECRET MIGRATION_SECRET TELEGRAM_BOT_TOKEN TELEGRAM_WEBHOOK_SECRET; do
            if [[ -z "${!name}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} )); then
            printf 'Missing required GitHub Actions secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi
          if [[ "$CLOUDFLARE_API_URL" != https://* ]]; then
            echo 'CLOUDFLARE_API_URL must use HTTPS.' >&2
            exit 1
          fi

      - name: Ensure Cloudflare D1 and R2 exist
        run: node scripts/ensure-cloudflare-d1.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply kamol-school-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Configure Worker secrets
        shell: bash
        env:
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          BOT_API_SECRET: ${{ secrets.BOT_API_SECRET }}
          MIGRATION_SECRET: ${{ secrets.MIGRATION_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          CLOUDFLARE_API_URL: ${{ secrets.CLOUDFLARE_API_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          put_secret() { printf '%s' "$2" | npx wrangler secret put "$1"; }
          put_secret AUTH_SECRET "$AUTH_SECRET"
          put_secret BOT_API_SECRET "$BOT_API_SECRET"
          put_secret MIGRATION_SECRET "$MIGRATION_SECRET"
          put_secret TELEGRAM_BOT_TOKEN "$TELEGRAM_BOT_TOKEN"
          put_secret TELEGRAM_WEBHOOK_SECRET "$TELEGRAM_WEBHOOK_SECRET"
          put_secret TELEGRAM_WEBAPP_URL "${CLOUDFLARE_API_URL%/}/miniapp.html"

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Configure Telegram webhook
        run: node scripts/set-telegram-webhook.mjs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          CLOUDFLARE_API_URL: ${{ secrets.CLOUDFLARE_API_URL }}

      - name: Verify live Worker responds with HTTP 200
        shell: bash
        env:
          CLOUDFLARE_API_URL: ${{ secrets.CLOUDFLARE_API_URL }}
        run: |
          for attempt in {1..10}; do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' "$CLOUDFLARE_API_URL/api/health" || true)
            if [[ "$status" == "200" ]]; then
              echo "Live API health check passed."
              exit 0
            fi
            sleep 6
          done
          echo "Live API health check failed (HTTP ${status:-no response})." >&2
          exit 1
