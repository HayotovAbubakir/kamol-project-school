name = "kamol-project-school"
compatibility_date = "2025-09-15"
main = "worker/index.js"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "kamol-school-db"
database_id = "f1b7121c-7ae3-4e12-a7d5-0a8c2ee93aab"
migrations_dir = "./migrations"

[triggers]
crons = ["* * * * *"]

[[r2_buckets]]
binding = "FILES"
bucket_name = "kamol-files"
